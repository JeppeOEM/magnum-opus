global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'aggregator'
    static_configs:
      - targets: ['aggregator:8080']

  - job_name: 'candle-service'
    static_configs:
      - targets: ['candle-blue:8081']

  - job_name: 'bot-service'
    static_configs:
      - targets: ['bot:8090']
