<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orderbook Heatmap</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0d0d0d; color: #e0e0e0; font-family: monospace; overflow: hidden; }

    #app {
      display: grid;
      grid-template-rows: 40px 32px 1fr;
      grid-template-columns: 1fr 220px;
      height: 100vh;
    }

    #toolbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      background: #161616;
      border-bottom: 1px solid #2a2a2a;
      font-size: 13px;
    }

    #toolbar select {
      background: #222;
      color: #e0e0e0;
      border: 1px solid #444;
      padding: 2px 6px;
      font-family: monospace;
      font-size: 13px;
    }

    #toolbar a {
      color: #888;
      text-decoration: none;
      font-size: 12px;
    }
    #toolbar a:hover { color: #e0e0e0; }
    #toolbar a.active { color: #4caf50; }

    #status {
      margin-left: auto;
      font-size: 11px;
      color: #666;
    }
    #status.connected { color: #4caf50; }
    #status.error { color: #f44336; }

    #gauge-panel {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: #131313;
      border-bottom: 1px solid #222;
      font-size: 12px;
      color: #888;
    }

    #gauge-value {
      font-size: 13px;
      font-weight: bold;
      color: #888;
      min-width: 60px;
    }

    #heatmap-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    #heatmap-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      background: #131313;
      border-bottom: 1px solid #222;
      font-size: 11px;
      flex-shrink: 0;
    }

    #nonlinear-toggle {
      background: #222;
      color: #e0e0e0;
      border: 1px solid #444;
      padding: 2px 8px;
      font-family: monospace;
      font-size: 11px;
      cursor: pointer;
    }
    #nonlinear-toggle:hover { background: #333; }

    #heatmap-body {
      position: relative;
      flex: 1;
      overflow: hidden;
    }

    #waiting-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 14px;
      background: #0d0d0d;
      z-index: 10;
    }

    #ladder-panel {
      background: #111;
      border-left: 1px solid #2a2a2a;
      overflow: hidden;
      position: relative;
    }

    canvas { display: block; }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <span>Orderbook</span>
      <select id="symbol-select">
        <option value="ETH-USDT">ETH-USDT</option>
        <option value="BTC-USDT">BTC-USDT</option>
      </select>
      <span id="mid-price">—</span>
      <span id="spread-label">spread —</span>
      <a href="/" class="nav-link">Charts</a>
      <a href="/heatmap.html" class="nav-link active">Heatmap</a>
      <span id="status">connecting…</span>
    </div>

    <div id="gauge-panel">
      <span>OFI Health:</span>
      <span id="gauge-value">—</span>
      <span id="gauge-desc" style="color:#555;font-size:11px;">waiting for candles1s…</span>
    </div>

    <div id="heatmap-panel">
      <div id="heatmap-header">
        <button id="nonlinear-toggle">Linear</button>
        <span style="color:#555;">time axis</span>
      </div>
      <div id="heatmap-body">
        <canvas id="heatmap-canvas"></canvas>
        <canvas id="axes-canvas" style="position:absolute;top:0;left:0;pointer-events:none;"></canvas>
        <div id="waiting-overlay">Waiting for data…</div>
      </div>
    </div>

    <div id="ladder-panel">
      <canvas id="ladder-canvas"></canvas>
    </div>
  </div>

  <script type="module" src="/src/heatmap-main.ts"></script>
</body>
</html>
