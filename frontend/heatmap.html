<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orderbook Heatmap</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0d0d0d; color: #e0e0e0; font-family: monospace; overflow: hidden; }

    #app {
      display: grid;
      grid-template-rows: 40px 1fr;
      grid-template-columns: 220px 1fr;
      height: 100vh;
    }

    #toolbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      background: #161616;
      border-bottom: 1px solid #2a2a2a;
      font-size: 13px;
    }

    #toolbar select {
      background: #222;
      color: #e0e0e0;
      border: 1px solid #444;
      padding: 2px 6px;
      font-family: monospace;
      font-size: 13px;
    }

    #toolbar a {
      color: #888;
      text-decoration: none;
      font-size: 12px;
    }
    #toolbar a:hover { color: #e0e0e0; }
    #toolbar a.active { color: #4caf50; }

    #status {
      margin-left: auto;
      font-size: 11px;
      color: #666;
    }
    #status.connected { color: #4caf50; }
    #status.error { color: #f44336; }

    #ladder-panel {
      background: #111;
      border-right: 1px solid #2a2a2a;
      overflow: hidden;
      position: relative;
    }

    #heatmap-panel {
      position: relative;
      overflow: hidden;
    }

    canvas { display: block; }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <span>Orderbook</span>
      <select id="symbol-select">
        <option value="ETH-USDT">ETH-USDT</option>
        <option value="BTC-USDT">BTC-USDT</option>
      </select>
      <span id="mid-price">—</span>
      <span id="spread-label">spread —</span>
      <a href="/" class="nav-link">Charts</a>
      <a href="/heatmap.html" class="nav-link active">Heatmap</a>
      <span id="status">connecting…</span>
    </div>

    <div id="ladder-panel">
      <canvas id="ladder-canvas"></canvas>
    </div>

    <div id="heatmap-panel">
      <canvas id="heatmap-canvas"></canvas>
      <canvas id="axes-canvas" style="position:absolute;top:0;left:0;pointer-events:none;"></canvas>
    </div>
  </div>

  <script type="module" src="/src/heatmap-main.ts"></script>
</body>
</html>
