name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "aggregator/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "aggregator/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    name: L1 + L2 + check-deps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aggregator

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: aggregator/go.sum

      - name: Download modules
        run: go mod download

      - name: Check dependencies (ARC11)
        run: make check-deps

      - name: L1 tests (pure, coverage gate)
        run: make test-l1

      - name: L2 tests (mock infrastructure)
        run: make test-l2
