services:
  aggregator:
    build:
      context: ./aggregator
      args:
        VERSION: ${VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - questdb
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 600m
          cpus: "2.0"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

  questdb:
    image: questdb/questdb:8.2.1
    ports:
      - "9000:9000"
      - "9009:9009"
    volumes:
      - questdb-data:/var/lib/questdb
      - questdb-conf:/etc/questdb
    deploy:
      resources:
        limits:
          memory: 8g
    restart: unless-stopped

volumes:
  redis-data:
  questdb-data:
  questdb-conf:
