services:
  aggregator:
    build:
      context: ./aggregator
      args:
        VERSION: ${VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    volumes:
      - ./config.yaml:/config.yaml:ro
    environment:
      CONFIG_FILE: /config.yaml
      KUCOIN_PUBLIC: "true"
      REDIS_ADDR: redis:6379
      QUESTDB_ILP_ADDR: questdb:9009
      QUESTDB_HTTP_ADDR: questdb:9000
    env_file:
      - path: .env
        required: false   # only needed for private KuCoin / Bybit credentials
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      questdb:
        condition: service_healthy
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 600m
          cpus: "2.0"
    restart: unless-stopped

  candle-blue:
    profiles: [candle-blue]
    build:
      context: ./candle-service
      args:
        VERSION: ${VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    env_file:
      - path: candle-service/.env
        required: false
    environment:
      CANDLE_SLOT: blue
      CANDLE_SERVICE_PORT: "8081"
      CANDLE_SHADOW_MODE: ${CANDLE_SHADOW_MODE:-false}
      REDIS_URL: redis://redis:6379
      QUESTDB_ILP_ADDR: questdb:9009
      QUESTDB_HTTP_ADDR: questdb:9000
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
      questdb:
        condition: service_healthy
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 400m
          cpus: "1.0"
    restart: unless-stopped

  candle-green:
    profiles: [candle-green]
    build:
      context: ./candle-service
      args:
        VERSION: ${VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    env_file:
      - path: candle-service/.env
        required: false
    environment:
      CANDLE_SLOT: green
      CANDLE_SERVICE_PORT: "8081"
      CANDLE_SHADOW_MODE: ${CANDLE_SHADOW_MODE:-false}
      REDIS_URL: redis://redis:6379
      QUESTDB_ILP_ADDR: questdb:9009
      QUESTDB_HTTP_ADDR: questdb:9000
    ports:
      - "8082:8081"
    depends_on:
      redis:
        condition: service_healthy
      questdb:
        condition: service_healthy
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 400m
          cpus: "1.0"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  questdb:
    image: questdb/questdb:latest
    ports:
      - "9000:9000"
      - "9009:9009"
    volumes:
      - questdb-data:/var/lib/questdb
      - questdb-conf:/etc/questdb
    deploy:
      resources:
        limits:
          memory: 8g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/exec?query=select+1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  bot:
    profiles: [bot]
    build:
      context: ./bot-service
      args:
        VERSION: ${VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
    env_file:
      - path: bot-service/.env
        required: false
    environment:
      QUESTDB_HTTP_ADDR: http://questdb:9000
      QUESTDB_ILP_ADDR: questdb:9009
      REDIS_URL: redis://redis:6379
    ports:
      - "8090:8090"
    depends_on:
      questdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"
    depends_on:
      - aggregator
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.10
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./monitoring/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.10
    command: -config.file=/etc/promtail/promtail.yaml
    volumes:
      - ./monitoring/promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  redis-data:
  questdb-data:
  questdb-conf:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
