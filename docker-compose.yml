services:
  aggregator:
    build:
      context: ./aggregator
      args:
        VERSION: ${VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    volumes:
      - ./config.yaml:/config.yaml:ro
    environment:
      CONFIG_FILE: /config.yaml
      KUCOIN_PUBLIC: "true"
      REDIS_ADDR: redis:6379
      QUESTDB_ILP_ADDR: questdb:9009
      QUESTDB_HTTP_ADDR: questdb:9000
    env_file:
      - path: .env
        required: false   # only needed for private KuCoin / Bybit credentials
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - questdb
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 600m
          cpus: "2.0"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

  questdb:
    image: questdb/questdb:8.2.1
    ports:
      - "9000:9000"
      - "9009:9009"
    volumes:
      - questdb-data:/var/lib/questdb
      - questdb-conf:/etc/questdb
    deploy:
      resources:
        limits:
          memory: 8g
    restart: unless-stopped

volumes:
  redis-data:
  questdb-data:
  questdb-conf:
